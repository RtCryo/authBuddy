name: Auth Service CI

on:
  push:
    branches: [main]
    paths:
      - 'auth-service/**'
      - 'docker-compose*.yml'
      - 'openspec/**'
      - '.github/workflows/auth-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'auth-service/**'
      - 'docker-compose*.yml'
      - 'openspec/**'
      - '.github/workflows/auth-service.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Check code style
        run: ./mvnw -B spotless:check

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # Docker is preinstalled on ubuntu-latest, which Testcontainers needs.
      - name: Verify
        run: ./mvnw -B verify

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate the production stack
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate the development stack
        run: docker compose config --quiet

      - name: Build the image
        run: docker build --tag auth-service:ci auth-service

  openspec:
    name: OpenSpec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Validate OpenSpec changes and specs
        run: npx --yes @fission-ai/openspec@1.13.2 validate --all --strict --no-interactive
