spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/authbuddy}
    username: ${SPRING_DATASOURCE_USERNAME:authbuddy}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

auth:
  signing-key: ${AUTH_SIGNING_KEY:}
  signing-key-file: ${AUTH_SIGNING_KEY_FILE:}
  previous-public-keys: ${AUTH_PREVIOUS_PUBLIC_KEYS:}
  token-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  registration-enabled: ${AUTH_REGISTRATION_ENABLED:true}
  rate-limit:
    max-attempts: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:10}
    window: 1m

server:
  port: 8080
  # Product UI proxies forward the client address in X-Forwarded-For. Tomcat trusts the header only
  # from loopback and the Docker bridge range 172.16.0.0/12, where the homebuddy network's proxies
  # live. Tomcat's default also trusts 10/8 and 192.168/16, which are home-LAN ranges: a LAN client
  # could then pick its own IP and slip past the per-IP rate limit.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: '127\.\d{1,3}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1|172\.(1[6-9]|2[0-9]|3[0-1])\.\d{1,3}\.\d{1,3}'

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
