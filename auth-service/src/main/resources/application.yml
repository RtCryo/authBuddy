spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/authbuddy}
    username: ${SPRING_DATASOURCE_USERNAME:authbuddy}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

auth:
  signing-key: ${AUTH_SIGNING_KEY:}
  signing-key-file: ${AUTH_SIGNING_KEY_FILE:}
  previous-public-keys: ${AUTH_PREVIOUS_PUBLIC_KEYS:}
  token-expiration-ms: ${JWT_EXPIRATION_MS:86400000}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
